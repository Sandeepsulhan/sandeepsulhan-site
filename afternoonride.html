<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Afternoon Ride Mix Show — Sandeep Sulhan</title>
<style>
  :root{
    --ink:#060A14;
    --ivory:#E9EEF7;
    --blue:#3E7BFA;
    --blue-deep:#12224D;
    --line: rgba(233,238,247,0.16);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--ink);
    color:var(--ivory);
    font-family: Georgia, 'Iowan Old Style', serif;
    line-height:1.5;
    min-height:100vh;
  }
  .top-nav{
    padding:32px 8vw 0;
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:13px; letter-spacing:0.05em;
  }
  .top-nav a{ color:rgba(233,238,247,0.6); text-decoration:none; }
  .top-nav a:hover{ color:var(--ivory); }

  main{
    padding:70px 8vw 120px;
    max-width:1100px; margin:0 auto;
  }
  .eyebrow{
    font-family:'Helvetica Neue', Arial, sans-serif;
    font-size:12px; letter-spacing:0.2em; text-transform:uppercase;
    color:var(--blue); margin-bottom:18px; font-weight:600;
  }
  h1{ font-size:clamp(34px, 5vw, 54px); font-weight:400; letter-spacing:-0.01em; max-width:16ch; margin-bottom:40px; }

  .layout{ display:grid; grid-template-columns:1fr 1.1fr; gap:60px; align-items:start; }
  .flyer{
    width:100%; max-width:520px;
    border:1px solid var(--line); border-radius:6px;
    display:block;
  }
  .info h2{ font-size:26px; font-weight:400; margin-bottom:18px; }
  .info p{
    font-family:'Helvetica Neue', Arial, sans-serif; font-size:16px;
    color:rgba(233,238,247,0.7); max-width:480px; margin-bottom:20px; line-height:1.7;
  }
  .btn-listen{
    display:inline-block; margin-top:14px;
    font-family:'Helvetica Neue', Arial, sans-serif; font-size:14px;
    letter-spacing:0.08em; text-transform:uppercase; font-weight:600;
    background:var(--blue); color:var(--ink); padding:18px 34px;
    border-radius:2px; text-decoration:none;
  }

  @media (max-width:760px){
    .layout{ grid-template-columns:1fr; }
  }
</style>
</head>
<body>

<div class="top-nav"><a href="/">&larr; Back to sandeepsulhan.com</a></div>

<main>
  <div class="eyebrow">Afternoon Ride</div>

  <div class="layout">
    <img class="flyer" src="/public/images/radio-show-flyer.jpg" alt="Afternoon Ride Mix Show flyer">
    <div class="info">
      <h2>Houston's Afternoon Ride</h2>
      <p>Bollywood, remixes, and mashups for Houston's South Asian community. Hosted live by Sandeep Sulhan on Masala Radio 98.7 FM.</p>
      <a href="https://masalaradio.com" target="_blank" rel="noopener" class="btn-listen">Listen Live</a>
    </div>
  </div>
</main>

</body>
</html>
